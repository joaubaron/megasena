name: Deploy para GitHub Pages

on:
  push:
    branches:
      - main
  # Permite rodar manualmente pela aba Actions se precisar
  workflow_dispatch:

# Permissões necessárias para o GitHub Pages oficial
permissions:
  contents: write
  pages: write
  id-token: write

# Garante que apenas um deploy rode por vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Atualizar CACHE_VERSION no sw.js
        run: |
          # Gera a versão baseada no fuso de SP
          VERSION=$(TZ="America/Sao_Paulo" date +'%d.%m.%Y-%H%M')
          sed -i "s/const CACHE_VERSION = '.*'/const CACHE_VERSION = '${VERSION}'/" sw.js
          echo "Nova versão aplicada: $VERSION"

      - name: Commitar sw.js atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sw.js
          # Se não houver mudanças, não faz commit
          git diff --cached --quiet || git commit -m "chore: atualiza cache version [skip ci]"
          # O --force evita erros se a branch remota tiver mudado
          git push origin HEAD:main

      # Em vez de peaceiris, usamos as ações oficiais do GitHub Pages
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload do artefato
        uses: actions/upload-pages-artifact@v3
        with:
          # Faz o upload de toda a raiz do projeto
          path: './'

      - name: Fazer o Deploy
        id: deployment
        uses: actions/deploy-pages@v4
