<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b4a">
<title>Gerador da Mega-Sena</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
--fundo:#eef4ee; --papel:#ffffff; --texto:#17261f; --suave:#5d6f66;
--verde:#0f6b4a; --verde2:#209869; --verde3:#0a4d35; --ouro:#e0a82e; --linha:#dbe5dc;
--sombra:0 14px 32px -16px rgba(10,60,40,.45);
--faixa1:#127a55; --faixa2:#0a4d35;
--chave:#c3cfc6;
}
@media (prefers-color-scheme:dark){
:root{
--fundo:#0b1511; --papel:#15241d; --texto:#eaf2ed; --suave:#9db3a8; --linha:#27392f;
--sombra:0 14px 32px -16px rgba(0,0,0,.7);
--faixa1:#0f6b4a; --faixa2:#08382a;
--chave:#3a4c43;
}
}
*{box-sizing:border-box}
html,body{margin:0}
body{
position:relative; isolation:isolate;
background:var(--fundo); color:var(--texto);
font:17px/1.45 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
padding:max(18px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
min-height:100vh;
-webkit-tap-highlight-color:transparent;
}
/* faixa verde do topo, com bolinhas de fundo */
body::before{
content:""; position:absolute; z-index:-1; top:0; left:0; right:0; height:230px;
background:
radial-gradient(circle at 90% 22%, rgba(255,255,255,.12) 0 44px, transparent 45px),
radial-gradient(circle at 76% 62%, rgba(224,168,46,.40) 0 20px, transparent 21px),
radial-gradient(circle at 98% 78%, rgba(255,255,255,.08) 0 30px, transparent 31px),
linear-gradient(160deg,var(--faixa1),var(--faixa2));
border-radius:0 0 30px 30px;
}
main{max-width:480px;margin:0 auto}

/* --- CABEÇALHO COM LOGO --- */
.cabecalho {
display: flex;
align-items: center;
gap: 16px;
margin: 6px 0 20px;
}

.cabecalho .logo {
width: 64px;
height: 64px;
object-fit: contain;
flex-shrink: 0;
border-radius: 12px;
}

.cabecalho .textos {
display: flex;
flex-direction: column;
justify-content: center;
}

.cabecalho h1 {
font-size: 1.5rem;
font-weight: 800;
letter-spacing: -.01em;
margin: 0 0 2px 0;
color: #fff;
line-height: 1.2;
}

.cabecalho .sub {
color: rgba(255,255,255,.86);
margin: 0;
font-size: 0.90rem;
line-height: 1.3;
}
/* ------------------------------- */

.painel{
background:var(--papel);border:1px solid var(--linha);border-radius:24px;
padding:22px 16px 16px;box-shadow:var(--sombra);
}
.bolas{display:flex;flex-wrap:nowrap;gap:6px;justify-content:center;align-items:center;container-type:inline-size}

/* bola de sorteio: esfera verde com miolo branco */
.bola{
position:relative;isolation:isolate;
width:auto;height:auto;flex:0 1 50px;min-width:0;aspect-ratio:1;border-radius:50%;
display:grid;place-items:center;
font-size:min(1.1rem,4.6cqw);font-weight:800;color:var(--verde3);
font-variant-numeric:tabular-nums;
background:radial-gradient(circle at 32% 26%,#46c995 0,var(--verde2) 32%,var(--verde) 72%,var(--verde3) 100%);
box-shadow:0 7px 10px -5px rgba(10,60,40,.55),inset 0 -4px 7px rgba(0,0,0,.2);
animation:cai .5s cubic-bezier(.34,1.56,.64,1) backwards;
}
.bola::before{
content:"";position:absolute;z-index:-1;inset:18%;border-radius:50%;
background:#fff;box-shadow:inset 0 1px 3px rgba(0,0,0,.16);
}
.bola::after{
content:"";position:absolute;top:9%;left:20%;width:28%;height:15%;border-radius:50%;
background:rgba(255,255,255,.6);transform:rotate(-28deg);filter:blur(1px);pointer-events:none;
}
.bola.extra{
color:#6b4a00; outline:2px dashed var(--ouro); outline-offset:2px;
background:radial-gradient(circle at 32% 26%,#fbe39a 0,#efc552 32%,var(--ouro) 72%,#b9831a 100%);
box-shadow:0 7px 10px -5px rgba(120,80,0,.55),inset 0 -4px 7px rgba(0,0,0,.18);
}
@keyframes cai{from{transform:translateY(-26px) scale(.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.bola{animation:none}*{transition:none!important}}

.vazio{color:var(--suave);text-align:center;margin:0}
.vazio::before{
content:"";display:block;height:46px;width:276px;max-width:100%;margin:0 auto 14px;
background:radial-gradient(circle,var(--linha) 0 18px,transparent 19px) 0 0/46px 46px repeat-x;
}
.jogo + .jogo{border-top:2px dashed var(--linha);margin-top:18px;padding-top:18px}
.titulo{margin:0 0 12px;font-weight:400;text-align:center;color:var(--verde)}
@media (prefers-color-scheme:dark){.titulo{color:var(--verde2)}}
.titulo .palavra-extra{color:var(--ouro);font-weight:400;position:relative}
.titulo .palavra-extra::after{content:"";position:absolute;left:0;right:0;bottom:-4px;border-bottom:2px dashed var(--ouro);text-shadow:none}

button{
font:inherit;font-weight:700;border:0;border-radius:14px;cursor:pointer;
padding:14px 16px;min-height:48px;
}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ouro);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.gerar{
width:100%;color:#fff;font-size:1.15rem;margin-top:18px;min-height:54px;border-radius:16px;
background:linear-gradient(180deg,var(--verde2),var(--verde));
box-shadow:0 4px 0 var(--verde3),0 12px 18px -8px rgba(15,107,74,.65);
transition:transform .08s,box-shadow .08s;
}
.gerar:active{transform:translateY(3px);box-shadow:0 1px 0 var(--verde3),0 6px 10px -6px rgba(15,107,74,.6)}
.sec{background:rgba(15,107,74,.08);color:var(--verde);border:1.5px solid rgba(15,107,74,.35)}
@media (prefers-color-scheme:dark){.sec{background:rgba(32,152,105,.12);color:#5fd3a2;border-color:rgba(32,152,105,.5)}}
.acoes{display:flex;gap:10px;margin-top:12px}
.acoes button{flex:1}

/* opções em um cartão, com chaves liga/desliga */
.opcoes{
margin-top:18px;background:var(--papel);border:1px solid var(--linha);
border-radius:20px;padding:4px 16px;display:grid;gap:0;box-shadow:var(--sombra);
}
.opcoes > *{padding:14px 0}
.opcoes > * + *{border-top:1px solid var(--linha)}
label.op{display:flex;gap:14px;align-items:center;cursor:pointer}
label.op > div{flex:1;min-width:0}
label.op input{
-webkit-appearance:none;appearance:none;order:2;flex:none;margin:0;cursor:pointer;
width:48px;height:29px;border-radius:999px;background:var(--chave);position:relative;
transition:background .2s;
}
label.op input::after{
content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;
background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s;
}
label.op input:checked{background:var(--verde2)}
label.op input:checked::after{transform:translateX(19px)}
label.op input:disabled{cursor:not-allowed}
label.op:has(input:disabled){opacity:.5}
label.op b{display:block}
label.op span{color:var(--suave);font-size:.9rem}
.linha{display:flex;align-items:center;justify-content:space-between;gap:12px}
select{
font:inherit;font-weight:700;padding:10px 12px;min-height:44px;border-radius:12px;
border:1.5px solid var(--linha);background:var(--fundo);color:var(--texto);
}
select:disabled{opacity:.5}
.chance{
margin-top:18px;padding:14px 16px;border-radius:16px;font-size:.95rem;
background:rgba(224,168,46,.14);border:1px solid rgba(224,168,46,.4);
}

/* tabela de chances/preços dentro do card .chance */
.chance table{
width:100%;
border-collapse:collapse;
font-size:.78rem;
font-variant-numeric:tabular-nums;
}
.chance th,
.chance td{
padding:7px 4px;
text-align:right;
border-bottom:1px solid rgba(224,168,46,.35);
white-space:nowrap;
}
.chance th:first-child,
.chance td:first-child{
text-align:left;
white-space:normal;
}
.chance thead th{
font-weight:800;
color:var(--verde3);
border-bottom-width:2px;
}
@media (prefers-color-scheme:dark){
.chance thead th{color:var(--verde2)}
}
.chance tbody tr:last-child td{border-bottom:0}
.chance .preco{font-weight:700}
.chance .chance-val{color:var(--suave)}

/* 2 linhas verticais separando as 3 colunas */
.chance th:not(:last-child),
.chance td:not(:last-child){
border-right:1px solid rgba(224,168,46,.35);
}
.chance thead th:not(:last-child){
border-right-width:2px;
}

.aviso{color:var(--suave);font-size:.9rem;margin:14px 6px 0}
h2{font-size:1.1rem;font-weight:800;margin:28px 2px 10px}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.hist li{
background:var(--papel);border:1px solid var(--linha);border-radius:16px;padding:12px 14px;
font-weight:700;letter-spacing:.03em;font-variant-numeric:tabular-nums;
}
.hist li{position:relative;padding-right:110px;min-height:86px}
.hist .acoes-item{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px;width:90px}
.hist .acoes-item button{min-height:30px;padding:3px 10px;font-size:.88rem;border-radius:10px;width:100%}
.hist .del{
background:transparent;
color:#b3382c;border:1.5px solid rgba(179,56,44,.4);
}
@media (prefers-color-scheme:dark){.hist .del{color:#ff9a8f;border-color:rgba(255,154,143,.45)}}
.hist .ex{color:#b9831a;font-weight:800}
@media (prefers-color-scheme:dark){.hist .ex{color:var(--ouro)}}
.hist small{display:block;color:var(--suave);font-weight:400;letter-spacing:0;margin-top:2px}
.toast{
position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);
background:var(--texto);color:var(--fundo);padding:11px 18px;border-radius:999px;font-size:.95rem;font-weight:600;
box-shadow:0 8px 20px -6px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s
}
.toast.on{opacity:1}
.versao{
font-size:.7rem;
font-weight:700;
padding:2px 8px;
border-radius:999px;
background:rgba(255,255,255,.2);
vertical-align:middle;
}

/* --- RODAPÉ: 2 BOTÕES NA MESMA LINHA, MESMO ESTILO --- */
.rodape-botoes{
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
margin-top:16px;
width:100%;
}
.btn-rodape{
background:transparent;
border:0;
color:var(--verde);
font:inherit;
font-size:1rem;
font-weight:700;
text-decoration:none;
padding:12px 4px;
min-height:44px;
cursor:pointer;
white-space:nowrap;
}
@media (prefers-color-scheme:dark){
.btn-rodape{color:#5fd3a2}
}
.ico{width:1.15em;height:1.15em;fill:currentColor;vertical-align:-.22em;margin-right:6px}
#limpar{color:#b3382c}
@media (prefers-color-scheme:dark){#limpar{color:#ff9a8f}}

/* --- MODAL --- */
.modal-fundo {
position: fixed;
top: 0; left: 0; right: 0; bottom: 0;
background: rgba(0,0,0,0.75);
display: none;
align-items: center;
justify-content: center;
z-index: 999;
padding: 20px;
backdrop-filter: blur(4px);
}
.modal-fundo.ativo {
display: flex;
}
.modal-conteudo {
background: var(--papel);
padding: 10px;
border-radius: 20px;
max-width: 100%;
max-height: 90vh;
position: relative;
box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.modal-conteudo img {
max-width: 100%;
max-height: 80vh;
border-radius: 12px;
display: block;
}
/* Botão X para fechar */
.btn-fechar {
position: absolute;
top: -15px;
right: -15px;
background: #b3382c;
color: #fff;
border-radius: 50%;
width: 36px;
height: 36px;
padding: 0;
min-height: 0;
font-size: 1.2rem;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
box-shadow: 0 4px 10px rgba(0,0,0,0.3);
border: 2px solid var(--papel);
}

/* --- CAIXA DE CONFIRMAÇÃO (no lugar da janela do sistema) --- */
.caixa{
background:var(--papel);border:1px solid var(--linha);border-radius:22px;
padding:22px 20px 18px;width:100%;max-width:340px;
box-shadow:0 14px 40px rgba(0,0,0,.45);
}
.caixa h3{margin:0 0 6px;font-size:1.2rem;font-weight:800;line-height:1.25}
.caixa p{margin:0 0 18px;color:var(--suave);font-size:1rem}
.caixa .botoes{display:flex;gap:10px}
.caixa .botoes button{flex:1}
button.perigo{background:#b3382c;color:#fff}
button.ok{background:var(--verde);color:#fff}

/* ============================================================
MELHORIAS VISUAIS (só CSS) — ficam DEPOIS do CSS original
============================================================ */

/* Botão principal: mais chamativo, com ícone */
.gerar{font-size:1.25rem;min-height:60px;letter-spacing:.01em}
.gerar::before{
content:""; 
display:inline-block; 
width:70px; 
height:70px; 
background:url('bolinhas.png') no-repeat center center; 
background-size:contain; 
vertical-align:middle; 
margin-right:12px;
}

/* Copiar e Salvar: ícone e texto maior */
#copiar::before{content:"📋 "}
#salvar::before{content:"💾 "}
.acoes button{font-size:1.05rem;min-height:52px}
.sec:disabled{opacity:.35;border-style:dashed}
.sec:active:not(:disabled){transform:scale(.97)}

/* Título da área de ajustes */
.opcoes::before{
content:"⚙️ Ajustes";
padding:14px 0 10px;
font-weight:800;font-size:1.05rem;color:var(--verde);
border-bottom:1px solid var(--linha);
}
@media (prefers-color-scheme:dark){.opcoes::before{color:#5fd3a2}}

/* Chaves liga/desliga (um pouco maiores) */
label.op input{width:64px;height:34px}
label.op input::after{width:28px;height:28px;top:3px;left:3px}
label.op input:checked::after{transform:translateX(30px)}

/* Textos de apoio mais fáceis de ler */
label.op b,.linha b{font-size:1.02rem}
label.op span{font-size:.92rem;line-height:1.4;margin-top:2px}

/* "Quantas das suas" fica como sub-opção */
.linha{
margin-left:12px;padding-left:14px;
border-left:3px solid var(--verde2);
}
.linha:has(select:disabled){border-left-color:var(--linha)}
select{min-height:48px;min-width:64px;font-size:1.05rem;text-align:center}

/* Tabela de chances mais legível */
.chance{font-size:1rem}
.chance table{font-size:.86rem}
.chance th,.chance td{padding:9px 5px}
.chance thead th{font-size:.82rem;text-transform:uppercase;letter-spacing:.03em}
.chance tbody tr:first-child td{font-weight:700}

/* Aviso com destaque */
.aviso{
font-size:.95rem;line-height:1.45;
padding:12px 14px;border-radius:14px;
background:rgba(15,107,74,.07);
border-left:4px solid var(--verde2);
margin:14px 0 0;
}

/* Apostas salvas */
h2{
font-size:1.2rem;margin:30px 2px 12px;
display:flex;align-items:center;gap:8px;
}
h2[hidden]{display:none}
h2::before{content:"📌"}
.hist li{font-size:1.05rem;line-height:1.6}
.hist .acoes-item button{min-height:36px;font-size:.92rem}

/* Rodapé mais fácil de tocar */
.rodape-botoes{
margin-top:22px;padding-top:10px;
border-top:2px dashed var(--linha);
}
.btn-rodape{font-size:1.05rem;min-height:48px;padding:12px 10px}

/* Bolas um pouco maiores e com mais respiro */
.painel{padding:24px 14px 16px}
.bolas{gap:7px}
.titulo{font-size:1rem;font-weight:700}

/* Caixa de confirmação: botões grandes */
.caixa .botoes button{min-height:52px;font-size:1.05rem}
</style>
</head>
<body>
<main>
<div class="cabecalho">
<img src="logo.png" alt="Logo Mega-Sena" class="logo">
<div class="textos">
<h1>Mega-Sena <span class="versao">v1.32</span></h1>
<p class="sub">Gera apostas de 6 dezenas + extra</p>
</div>
</div>

<section class="painel" aria-live="polite">
<div id="jogos"><p class="vazio"></p></div>
<button class="gerar" id="gerar">Gerar 2 apostas</button>
<div class="acoes">
<button class="sec" id="copiar" disabled>Copiar</button>
<button class="sec" id="salvar" disabled>Salvar</button>
</div>
</section>

<div class="opcoes">
<label class="op">
<input type="checkbox" id="optMinhas" checked>
<div><b>Usar minhas dezenas</b><span>Cada aposta leva algumas das suas: <span id="listaMinhas"></span></span></div>
</label>
<div class="linha">
<label for="qtdMinhas"><b>Quantas das suas dezenas por aposta</b></label>
<select id="qtdMinhas">
<option value="1">1</option><option value="2">2</option><option value="3" selected>3</option>
<option value="4">4</option><option value="5">5</option><option value="6">6</option>
</select>
</div>
<label class="op">
<input type="checkbox" id="optQuentes" checked>
<div><b>Completar com as mais sorteadas</b><span><span id="fonteQuentes">Do histórico</span>: <span id="listaQuentes"></span>. Se desligar, completa ao acaso</span></div>
</label>
<label class="op">
<input type="checkbox" id="optExtra" checked>
<div><b>Mostrar dezena extra</b><span>Se usar, a aposta passa a ter 7 dezenas e custa 7 vezes mais</span></div>
</label>
<label class="op">
<input type="checkbox" id="optCoringa">
<div><b>Usar o 27 como coringa</b><span>É o seu coringa. Se desligar, a extra é sorteada</span></div>
</label>
<label class="op">
<input type="checkbox" id="optComum" checked>
<div><b>Evitar apostas comuns</b><span>Evita sequências, datas e desenhos no volante. Não muda a chance. Divide menos o prêmio</span></div>
</label>
</div>

<div class="chance" id="chance"></div>
<p class="aviso">O sorteio é pura sorte. Nenhuma aposta, nem a das mais sorteadas, tem mais chance que outra</p>

<h2 id="tituloSalvas" hidden>Apostas salvas</h2>
<ul class="hist" id="hist"></ul>
<div class="rodape-botoes">
<button class="btn-rodape" id="limpar" type="button" disabled><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>Apagar todas</button>
<button class="btn-rodape" id="btnMeusNumeros" type="button"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>Meus números</button>
</div>
</main>

<!-- Modal Meus Números -->
<div class="modal-fundo" id="modalNumeros" role="dialog" aria-modal="true" aria-label="Meus números">
<div class="modal-conteudo">
<button class="btn-fechar" id="fecharModal" type="button" aria-label="Fechar">×</button>
<img src="numeros.webp" alt="Meus números da sorte">
</div>
</div>

<!-- Confirmação -->
<div class="modal-fundo" id="modalConfirma" role="dialog" aria-modal="true" aria-labelledby="confTitulo">
<div class="caixa">
<h3 id="confTitulo"></h3>
<p id="confTexto"></p>
<div class="botoes">
<button class="sec" id="confNao" type="button">Cancelar</button>
<button class="perigo" id="confSim" type="button">Apagar</button>
</div>
</div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
var $ = function(id){return document.getElementById(id)};
var CHAVE = 'megasena_salvos_v1';
var CFG = 'megasena_cfg_v1';
var MINHAS = [5,17,23,36,38,44];               // suas 6 dezenas fortes
var CORINGA = 27;                              // seu coringa: extra fixa, se a opção estiver ligada
var QUENTES_FIXA = [4,10,27,30,32,33,34,35,37,53]; // reserva (10): mais sorteadas no histórico geral, fora as suas
var QUENTES = QUENTES_FIXA.slice();            // troca pela lista dos últimos 5 anos quando carregar
var HIST_URL = 'https://resultadomega.com.br/api/concursos.json'; // [concurso, "AAAA-MM-DD", [dezenas]]
var HIST = 'megasena_hist_v4';
var jogos = null; // [{dez:[], extra:n|null}, {dez:[], extra:n|null}]
var vistos = {}; // jogos já gerados nesta sessão

// sorteio sem viés
function rnd(n){
var lim = Math.floor(4294967296 / n) * n, x;
var b = new Uint32Array(1);
do { crypto.getRandomValues(b); x = b[0]; } while (x >= lim);
return x % n;
}
function sortear(qtd, exceto){
var pool = [], i;
for (i = 1; i <= 60; i++) if (!exceto || exceto.indexOf(i) < 0) pool.push(i);
var out = [];
while (out.length < qtd){
var k = rnd(pool.length);
out.push(pool.splice(k,1)[0]);
}
return out.sort(function(a,b){return a-b});
}
// jogos que muita gente aposta
function comum(d){
var seq = 1, i, k;
for (i = 1; i < d.length; i++){
seq = (d[i] === d[i-1] + 1) ? seq + 1 : 1;
if (seq >= 3) return true;                                  // 3 seguidos
}
if (d.filter(function(n){return n <= 31}).length >= 5) return true;   // quase só datas
var fim = {}, lin = {};
d.forEach(function(n){
fim[n % 10] = (fim[n % 10] || 0) + 1;
var l = Math.floor((n - 1) / 10); lin[l] = (lin[l] || 0) + 1;
});
for (k in fim) if (fim[k] >= 3) return true;                  // mesmo final (coluna do volante)
for (k in lin) if (lin[k] >= 4) return true;                  // 4 na mesma linha do volante
var par = d.filter(function(n){return n % 2 === 0}).length;
if (par === 0 || par === 6) return true;                      // todos pares/ímpares
for (i = 0; i < d.length - 3; i++){                           // progressão (ex.: 5-10-15-20)
var p = d[i+1] - d[i], ok = 1;
for (k = i + 2; k < d.length && k < i + 4; k++) if (d[k] - d[k-1] !== p) ok = 0;
if (ok) return true;
}
return false;
}
function escolher(lista, n){
var pool = lista.slice(), out = [];
while (out.length < n && pool.length){
var k = rnd(pool.length);
out.push(pool.splice(k,1)[0]);
}
return out;
}
function montar(){
if (!$('optMinhas').checked) return sortear(6, usaCoringa() ? [CORINGA] : null);
var k = +$('qtdMinhas').value;
var minhas = escolher(MINHAS, k); // Pega APENAS da lista das 6 fortes

var resto = 6 - k, extras;
if ($('optQuentes').checked){
// Sorteia as dezenas que faltam só entre as mais sorteadas (sem repetir)
var bolo = QUENTES.filter(function(n, i, a){return a.indexOf(n) === i && minhas.indexOf(n) < 0 && !(usaCoringa() && n === CORINGA)});
extras = escolher(bolo, resto);
} else {
// Se desligar as quentes, sorteia de 1 a 60, sem usar mais nenhuma das suas
extras = sortear(resto, usaCoringa() ? MINHAS.concat(CORINGA) : MINHAS);
}
return minhas.concat(extras).sort(function(a,b){return a-b});
}
function usaCoringa(){ return $('optExtra').checked && $('optCoringa').checked; }
function extraDe(d){ return usaCoringa() ? CORINGA : sortear(1, d)[0]; }
var apertado = false;
function um(){
var d, e, k, ruim, t = 0;
do {
d = montar();
e = $('optExtra').checked ? extraDe(d) : null;
k = d.join('-') + '|' + e;
ruim = ($('optComum').checked && comum(d)) || vistos[k];
t++;
} while (ruim && t < 500);
if (ruim) apertado = true;
vistos[k] = 1;
return {dez: d, extra: e, c: usaCoringa()};
}
function gerar(){
jogos = []; apertado = false;
for (var i = 0; i < 2; i++){
jogos.push(um());
}
desenhar();
if (apertado) informar('Poucas apostas diferentes', 'Use menos das suas dezenas para variar');
}
function bola(n, extra, atraso){
var s = document.createElement('div');
s.className = 'bola' + (extra ? ' extra' : '');
s.textContent = (n < 10 ? '0' : '') + n;
s.style.animationDelay = atraso + 'ms';
return s;
}
function desenhar(){
var c = $('jogos'); c.innerHTML = '';
jogos.forEach(function(j, g){
var bloco = document.createElement('div'); bloco.className = 'jogo';
var t = document.createElement('p'); t.className = 'titulo'; t.innerHTML = 'Aposta ' + (g + 1) + ' com 6 dezenas' + (j.extra != null ? ' + <b class="palavra-extra">' + (j.c ? 'coringa' : 'extra') + '</b>' : '');
var b = document.createElement('div'); b.className = 'bolas';

// Junta dezenas + extra (se houver) e ordena
var lista = j.dez.slice();
if (j.extra != null) lista.push(j.extra);
lista.sort(function(a, b){ return a - b; });

lista.forEach(function(n, i){
var ehExtra = (j.extra != null && n === j.extra);
b.appendChild(bola(n, ehExtra, g * 500 + i * 70));
});

bloco.appendChild(t); bloco.appendChild(b);
c.appendChild(bloco);
});
$('copiar').disabled = false; $('salvar').disabled = false;
}
function txt1(j){
var f = function(n){return (n<10?'0':'')+n};
var lista = j.dez.slice();
if (j.extra != null) lista.push(j.extra);
lista.sort(function(a,b){ return a - b; });
return lista.map(function(n){
return (j.extra != null && n === j.extra) ? f(n) + '*' : f(n);
}).join(' ');
}
function txt(l){
return l.map(function(j,i){ return 'Aposta ' + (i+1) + ': ' + txt1(j).replace(/\*/g, ''); }).join('\n');
}
function aviso(m, ms){
var t = $('toast'); t.textContent = m; t.classList.add('on');
clearTimeout(aviso.t); aviso.t = setTimeout(function(){t.classList.remove('on')}, ms || 1800);
}
function ler(){ try { return JSON.parse(localStorage.getItem(CHAVE)) || []; } catch(e){ return []; } }
function gravar(l){ try { localStorage.setItem(CHAVE, JSON.stringify(l)); } catch(e){} }
function lista(){
var l = ler(), ul = $('hist'); ul.innerHTML = '';
l.forEach(function(item, idx){
var li = document.createElement('li');
var f = function(n){return (n<10?'0':'')+n};
var js = item.jogos || [item];
li.innerHTML = js.map(function(j){
var lista = j.dez.slice();
if (j.extra != null) lista.push(j.extra);
lista.sort(function(a, b){ return a - b; });
return lista.map(function(n){
return (j.extra != null && n === j.extra) ? '<span class="ex">' + f(n) + '</span>' : f(n);
}).join(' ');
}).join('<br>') + '<small>' + new Date(item.em).toLocaleDateString('pt-BR') + '</small>';
var x = document.createElement('button');
x.type = 'button'; x.className = 'del'; x.textContent = 'Apagar';
x.setAttribute('aria-label', 'Apagar esta aposta salva');
x.onclick = function(){
perguntar('Apagar esta aposta?', 'Ela sai da lista e não dá para voltar.', 'Apagar', function(){
var atual = ler(); atual.splice(idx, 1);
gravar(atual); lista(); aviso('Apagado');
});
};
var cp = document.createElement('button');
cp.type = 'button'; cp.className = 'sec cop'; cp.textContent = 'Copiar';
cp.setAttribute('aria-label', 'Copiar esta aposta salva');
cp.onclick = function(){
var t = txt(js);
(navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject())
.then(function(){aviso('Copiado')}, function(){aviso('Não deu para copiar')});
};
var ac = document.createElement('div'); ac.className = 'acoes-item';
ac.appendChild(x); ac.appendChild(cp);
li.appendChild(ac);
ul.appendChild(li);
});
$('limpar').disabled = l.length === 0;
$('tituloSalvas').hidden = l.length === 0;
}
function chance(){
$('chance').innerHTML =
'<table>' +
'<thead><tr>' +
'<th>Números</th><th>Preço</th><th>Chances</th>' +
'</tr></thead>' +
'<tbody>' +
'<tr><td>6 (mín)</td><td class="preco">R$ 6,00</td><td class="chance-val">1 em 50.063.860</td></tr>' +
'<tr><td>7</td><td class="preco">R$ 42,00</td><td class="chance-val">1 em 7.151.980</td></tr>' +
'<tr><td>10</td><td class="preco">R$ 1.260,00</td><td class="chance-val">1 em 238.399</td></tr>' +
'<tr><td>15</td><td class="preco">R$ 30.030,00</td><td class="chance-val">1 em 10.003</td></tr>' +
'<tr><td>20 (máx)</td><td class="preco">R$ 232.560,00</td><td class="chance-val">1 em 1.292</td></tr>' +
'</tbody>' +
'</table>';
}

function fmt(l){return l.map(function(n){return (n<10?'0':'')+n}).join(' ')}
function mostrarQuentes(rotulo){
$('fonteQuentes').textContent = rotulo;
$('listaQuentes').textContent = fmt(QUENTES.filter(function(n){return !(usaCoringa() && n === CORINGA)}));
}
// conta as dezenas dos últimos 5 anos; devolve as 10 que mais saíram (fora as suas)
function calcular(lista){
if (!Array.isArray(lista)) return null;
var d = new Date(); d.setFullYear(d.getFullYear() - 5);
var corte = d.toISOString().slice(0,10), cont = {}, n = 0;
lista.forEach(function(c){
if (!Array.isArray(c) || typeof c[1] !== 'string' || !Array.isArray(c[2]) || c[2].length !== 6) return;
if (c[1] < corte) return;
n++;
c[2].forEach(function(x){ x = +x; if (x >= 1 && x <= 60) cont[x] = (cont[x] || 0) + 1; });
});
if (n < 300) return null;
var top = Object.keys(cont).map(Number)
.filter(function(x){return MINHAS.indexOf(x) < 0})
.sort(function(a,b){return cont[b] - cont[a] || a - b})
.slice(0,10).sort(function(a,b){return a - b});
return top.length === 10 ? top : null;
}
function historico(){
var c = null;
try { c = JSON.parse(localStorage.getItem(HIST)); } catch(e){}
if (c && c.q && c.q.length === 10){ QUENTES = c.q; mostrarQuentes('Últimos 5 anos'); }
else mostrarQuentes('Histórico geral');
if (c && c.em && Date.now() - c.em < 43200000) return;   // atualiza a cada 12 horas
if (!window.fetch) return;
var ctl = window.AbortController ? new AbortController() : null;
var to = setTimeout(function(){ if (ctl) ctl.abort(); }, 10000);
fetch(HIST_URL, {cache:'no-cache', signal: ctl ? ctl.signal : undefined})
.then(function(r){ return r.json(); })
.then(function(lista){
var q = calcular(lista);
if (!q) return;
QUENTES = q; mostrarQuentes('Últimos 5 anos');
try { localStorage.setItem(HIST, JSON.stringify({em: Date.now(), q: q})); } catch(e){}
})
.catch(function(){})
.then(function(){ clearTimeout(to); });
}
function lerCfg(){
try {
var c = JSON.parse(localStorage.getItem(CFG)) || {};
if (c.minhas != null) $('optMinhas').checked = c.minhas;
if (c.quentes != null) $('optQuentes').checked = c.quentes;
if (c.extra != null) $('optExtra').checked = c.extra;
if (c.comum != null) $('optComum').checked = c.comum;
if (c.coringa != null) $('optCoringa').checked = c.coringa;
if (c.qtd) $('qtdMinhas').value = c.qtd;
} catch(e){}
}
function salvarCfg(){
try { localStorage.setItem(CFG, JSON.stringify({
minhas: $('optMinhas').checked, quentes: $('optQuentes').checked, qtd: $('qtdMinhas').value,
extra: $('optExtra').checked, comum: $('optComum').checked, coringa: $('optCoringa').checked
})); } catch(e){}
}
function atualizaOpcoes(){
var on = $('optMinhas').checked;
var k = +$('qtdMinhas').value;
$('qtdMinhas').disabled = !on;
$('optQuentes').disabled = !on || k >= 6;
$('optCoringa').disabled = !$('optExtra').checked;
salvarCfg();
}
['optMinhas','optQuentes','qtdMinhas'].forEach(function(id){ $(id).onchange = atualizaOpcoes; });
$('listaMinhas').textContent = fmt(MINHAS);
$('listaQuentes').textContent = fmt(QUENTES);
lerCfg(); atualizaOpcoes(); historico();

$('gerar').onclick = gerar;
$('optComum').onchange = salvarCfg;
$('optExtra').onchange = function(){
salvarCfg();
chance();
if (jogos){
var on = this.checked;
if (usaCoringa() && jogos.some(function(j){ return j.dez.indexOf(CORINGA) >= 0; })){ atualizaOpcoes(); mostrarQuentes($('fonteQuentes').textContent); gerar(); return; }
jogos.forEach(function(j){
if (on && j.extra == null){ j.extra = extraDe(j.dez); j.c = usaCoringa(); }
if (!on) j.extra = null;
});
desenhar();
}
atualizaOpcoes(); mostrarQuentes($('fonteQuentes').textContent);
};
$('optCoringa').onchange = function(){
salvarCfg();
mostrarQuentes($('fonteQuentes').textContent);
if (!jogos || !$('optExtra').checked) return;
if (usaCoringa() && jogos.some(function(j){ return j.dez.indexOf(CORINGA) >= 0; })){ gerar(); return; }
jogos.forEach(function(j){ j.extra = extraDe(j.dez); j.c = usaCoringa(); });
desenhar();
};
$('copiar').onclick = function(){
if (!jogos) return;
var t = txt(jogos);
(navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject())
.then(function(){aviso('Copiado')}, function(){aviso('Não deu para copiar')});
};
$('salvar').onclick = function(){
if (!jogos) return;
var l = ler();
var igual = function(js){ return js.map(txt1).join('|'); };
var atual = igual(jogos);
if (l.some(function(it){ return igual(it.jogos || [it]) === atual; })){ aviso('Já está salva'); return; }
l.unshift({jogos: jogos, em: Date.now()});
gravar(l.slice(0,20)); lista(); aviso('Salvo');
};
$('limpar').onclick = function(){
perguntar('Apagar todas as apostas?', 'Todas as apostas salvas vão sair da lista. Não dá para voltar.', 'Apagar', function(){
gravar([]); lista(); aviso('Apagado');
});
};

// --- Caixa de confirmação (no lugar da janela do sistema) ---
var conf = $('modalConfirma'), confAcao = null;
function perguntar(titulo, texto, rotulo, acao){
$('confTitulo').textContent = titulo;
$('confTexto').textContent = texto;
$('confSim').textContent = rotulo;
$('confSim').className = 'perigo';
$('confNao').hidden = false;
confAcao = acao;
conf.classList.add('ativo');
$('confNao').focus();
}
function informar(titulo, texto){
$('confTitulo').textContent = titulo;
$('confTexto').textContent = texto;
$('confSim').textContent = 'Entendi';
$('confSim').className = 'ok';
$('confNao').hidden = true;
confAcao = null;
conf.classList.add('ativo');
$('confSim').focus();
}
function fecharConf(){ conf.classList.remove('ativo'); confAcao = null; }
$('confNao').onclick = fecharConf;
$('confSim').onclick = function(){ var f = confAcao; fecharConf(); if (f) f(); };
conf.onclick = function(e){ if (e.target === conf) fecharConf(); };
// tecla Esc fecha as caixas abertas
document.addEventListener('keydown', function(e){
if (e.key !== 'Escape') return;
fecharConf();
$('modalNumeros').classList.remove('ativo');
});

chance(); lista();

// --- Lógica do Modal Meus Números ---
var modal = $('modalNumeros');
var btnMeusNumeros = $('btnMeusNumeros');

btnMeusNumeros.onclick = function() {
modal.classList.add('ativo');
};

$('fecharModal').onclick = function() {
modal.classList.remove('ativo');
};

// Fecha o modal se clicar no fundo escuro
modal.onclick = function(e) {
if (e.target === modal) {
modal.classList.remove('ativo');
}
};

if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('sw.js')
.catch(function(erro) {
console.error('Erro ao registrar Service Worker:', erro);
});
}
})();
